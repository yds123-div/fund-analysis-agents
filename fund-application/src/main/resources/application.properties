# ============================================
# Fund Analysis Agents - Application Config
# ============================================
# Server
server.port=${SERVER_PORT:8080}
spring.application.name=fund-analysis-agents
# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
# JWT
jwt.secret=${JWT_SECRET:FundAnalysisAgents2026SecretKey!!}
# MySQL
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fund_analysis}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:fund_analysis_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
# MyBatis Plus
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
# SpringDoc OpenAPI (production: set springdoc.enabled=false)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.enabled=${SWAGGER_ENABLED:true}
# CORS (production: set to actual domain, e.g. https://yourdomain.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Mail (optional)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Bark notification
notification.bark.server-url=${BARK_SERVER_URL:https://api.day.app}
notification.bark.device-key=${BARK_DEVICE_KEY:}
# Tushare (optional)
datasource.tushare.token=${TUSHARE_API_TOKEN:}
datasource.tushare.base-url=https://api.tushare.pro
# Logging (详细配置见 logback-spring.xml)
logging.config=classpath:logback-spring.xml
# Spring AI - placeholder to satisfy auto-configuration (actual models created programmatically)
spring.ai.openai.api-key=placeholder
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.dashscope.api-key=${AI_DASHSCOPE_API_KEY:placeholder}
